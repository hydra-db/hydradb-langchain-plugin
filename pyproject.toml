[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-hydradb"
version = "0.1.0"
description = "HydraDB integration for LangChain: persistent memory and retrieval."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "HydraDB", email = "support@hydradb.com" }]
keywords = ["hydradb", "langchain", "memory", "retrieval", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langchain-core>=0.3.0",
  "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.24"]

[project.urls]
Homepage = "https://hydradb.com"
Documentation = "https://docs.hydradb.com/"
Repository = "https://github.com/hydra-db/hydradb-langchain"

[tool.hatch.build.targets.wheel]
packages = ["langchain_hydradb"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
